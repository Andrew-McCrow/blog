services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blogdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blogdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  blog-api:
    build: ./blog-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blogdb}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  prisma-studio:
    build: ./blog-api
    command: npx prisma studio --port 5555 --browser none
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blogdb}
    depends_on:
      postgres:
        condition: service_healthy

  blog-management:
    build:
      context: ./blog-management
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5175:5175"
    depends_on:
      - blog-api

  public-website:
    build:
      context: ./public-website
      args:
        VITE_POSTS_URL: ${VITE_POSTS_URL:-http://localhost:3000/api/posts}
        VITE_COMMENTS_URL: ${VITE_COMMENTS_URL:-http://localhost:3000/api/comments}
    ports:
      - "5173:5173"
    depends_on:
      - blog-api

volumes:
  postgres_data:
